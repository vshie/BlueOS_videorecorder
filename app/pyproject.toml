[project]
name = "dropcam"
version = "1.0.0"
description = "DropCam - BlueOS Standalone Video Recording Extension"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "flask",
    "requests",
    # Servo/PWM: pigpio is the Pi 4 path (DMA-timed). The Pi 5 path uses lgpio
    # (RP1, software-timed); lgpio is built from the lg source archive in the
    # Dockerfile (its pip wrapper can't link liblgpio on this base image), so
    # it is intentionally not listed as a pip dependency here.
    "pigpio",
    # WS2812 RGB LED: rpi_ws281x is the Pi 4 path; the Pi 5 path is a
    # self-contained SPI driver in gpio_backend.py that only needs spidev.
    "rpi_ws281x",
    "spidev",
    "Pillow",
    "dalybms",
    "pyserial",
]
