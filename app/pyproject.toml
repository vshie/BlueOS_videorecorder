[project]
name = "dropcam"
version = "1.0.0"
description = "DropCam - BlueOS Standalone Video Recording Extension"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "flask",
    "requests",
    # Servo/PWM: PCA9685 over I2C on the DeckHand PCB (talks via smbus2)
    # is the primary path on both Pi 4 and Pi 5. pigpio (Pi 4 DMA) and
    # lgpio (Pi 5 / RP1) remain as fallbacks for legacy direct-PWM
    # boards; lgpio is built from the lg source archive in the Dockerfile
    # (its pip wrapper can't link liblgpio on this base image), so it is
    # intentionally not listed as a pip dependency here.
    "pigpio",
    # WS2812 RGB LED: rpi_ws281x is the Pi 4 path; the Pi 5 path is a
    # self-contained SPI driver in gpio_backend.py that only needs spidev.
    "rpi_ws281x",
    "spidev",
    # I2C for the PCA9685 PWM controller and the MCP7940N RTC on the
    # DeckHand PCB (both on the Pi's primary I2C-1 bus).
    "smbus2",
    "Pillow",
    "dalybms",
    "pyserial",
]
