version: '3.7'

services:
  dropcam:
    build: .
    container_name: blueos-dropcam
    network_mode: host
    ports:
      - "5423:5423"
    volumes:
      - /usr/blueos/extensions/videorecorder:/app/videorecordings
      - /dev/video2:/dev/video2
      - /dev/snd:/dev/snd
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/spidev0.0:/dev/spidev0.0
    privileged: true
    restart: unless-stopped
    environment:
      - BLUEOS=true
